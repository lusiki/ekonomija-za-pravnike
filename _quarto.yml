project:
  type: book
  output-dir: _book
  resources:
    - ucenje/*.md
    - dizajn/ravnoteza.svg
    - dizajn/fontovi/*
lang: hr
language:
  toc-title-document: "U ovom poglavlju"
  toggle-section: "Otvori ili zatvori dio knjige"
  toggle-sidebar: "Otvori ili zatvori sadržaj"
  crossref-fig-title: Slika
  crossref-tbl-title: Tablica
  section-title-appendices: Dodaci
book:
  title: Osnove ekonomije za pravnike
  subtitle: Od najamnine do javnog duga
  output-file: ekonomija-za-pravnike
  sidebar:
    collapse-level: 1
  chapters:
    - index.qmd
    - part: "Kako biramo"
      chapters:
        - poglavlja/01.qmd
    - part: "Cijene, kupci i pravila tržišta"
      chapters:
        - poglavlja/02.qmd
        - poglavlja/03.qmd
        - poglavlja/04.qmd
        - poglavlja/05.qmd
        - poglavlja/06.qmd
        - poglavlja/07.qmd
        - poglavlja/08.qmd
    - part: "Od kućnog računa do gospodarstva"
      chapters:
        - poglavlja/09.qmd
        - poglavlja/10.qmd
        - poglavlja/11.qmd
    - part: "Posao, plaće i cijene"
      chapters:
        - poglavlja/12.qmd
        - poglavlja/13.qmd
    - part: "Novac u banci"
      chapters:
        - poglavlja/14.qmd
        - poglavlja/15.qmd
    - part: "Država troši i posuđuje"
      chapters:
        - poglavlja/16.qmd
        - poglavlja/17.qmd
    - part: "Trgovina preko granice"
      chapters:
        - poglavlja/18.qmd
        - poglavlja/19.qmd
        - poglavlja/20.qmd
    - part: "Kako živi Hrvatska?"
      chapters:
        - poglavlja/21.qmd
  appendices:
    - dodaci/A.qmd
    - dodaci/B.qmd
    - dodaci/C.qmd
format:
  html:
    theme:
      light: [default, dizajn/tema.scss]
      dark: [default, dizajn/tema.scss, dizajn/tamna.scss]
    include-after-body: dizajn/otvaranje.html
    grid:
      sidebar-width: 280px
      body-width: 680px
      margin-width: 260px
      gutter-width: 2.2rem
    css: dizajn/knjiga.css
    toc: true
  typst:
    font-paths: [dizajn/fontovi]
    papersize: iso-b5
    template-partials:
      - tisak/typst-show.typ

