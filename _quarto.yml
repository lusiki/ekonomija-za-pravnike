project:
  type: book
  output-dir: _book
  resources:
    - ucenje/*.md
    - dizajn/ravnoteza.svg
    - dizajn/fontovi/*
lang: hr
language:
  crossref-fig-title: Slika
  crossref-tbl-title: Tablica
  section-title-appendices: Dodaci
book:
  title: Osnove ekonomije za pravnike
  subtitle: Teorija, regulacija i politike
  output-file: ekonomija-za-pravnike
  chapters:
    - index.qmd
    - part: "Izbor ima cijenu"
      chapters:
        - poglavlja/01.qmd
    - part: "Tržišta i pravila igre"
      chapters:
        - poglavlja/02.qmd
        - poglavlja/03.qmd
        - poglavlja/04.qmd
        - poglavlja/05.qmd
        - poglavlja/06.qmd
        - poglavlja/07.qmd
        - poglavlja/08.qmd
    - part: "Gospodarstvo pod povećalom"
      chapters:
        - poglavlja/09.qmd
        - poglavlja/10.qmd
        - poglavlja/11.qmd
    - part: "Rad, plaće i cijene"
      chapters:
        - poglavlja/12.qmd
        - poglavlja/13.qmd
    - part: "Put novca"
      chapters:
        - poglavlja/14.qmd
        - poglavlja/15.qmd
    - part: "Država kao dužnik"
      chapters:
        - poglavlja/16.qmd
        - poglavlja/17.qmd
    - part: "Preko granice"
      chapters:
        - poglavlja/18.qmd
        - poglavlja/19.qmd
        - poglavlja/20.qmd
    - part: "Hrvatska u brojkama"
      chapters:
        - poglavlja/21.qmd
  appendices:
    - dodaci/A.qmd
    - dodaci/B.qmd
    - dodaci/C.qmd
format:
  html:
    theme:
      light: [default, dizajn/tema.scss]
      dark: [default, dizajn/tema.scss, dizajn/tamna.scss]
    include-after-body: dizajn/otvaranje.html
    grid:
      sidebar-width: 280px
      body-width: 680px
      margin-width: 260px
      gutter-width: 2.2rem
    css: dizajn/knjiga.css
    toc: true
  typst:
    font-paths: [dizajn/fontovi]
    papersize: iso-b5
    template-partials:
      - tisak/typst-show.typ

