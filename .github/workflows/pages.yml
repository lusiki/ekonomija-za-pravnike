name: Izgradi i objavi knjigu
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38
      - run: quarto render --to all
      - name: Provjeri izlaze
        run: |
          test -s _book/index.html
          test -s _book/ekonomija-za-pravnike.pdf
          test -s _book/ucenje/mentor.md
          test -s _book/ucenje/najamnina.md
          grep -q 'id="granica"' _book/poglavlja/02.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _book
      - id: deploy
        uses: actions/deploy-pages@v4
